[package]
name = "focal-vector"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A low-latency vector search engine"

[workspace]
members = ["crates/focal-vector-client", "crates/focal-vector-protocol"]
resolver = "2"

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
memmap2 = "0.9.11"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
rayon = "1.11"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.15.0", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
focal-vector-protocol = { path = "crates/focal-vector-protocol" }
tokio = { version = "~1.47.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
focal-vector-client = { path = "crates/focal-vector-client" }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring"] }
tower = { version = "0.5", features = ["util"] }

[lib]
name = "focal_vector"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1
